<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Venda - PrintFlow</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='icons/bootstrap-icons.css') }}" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card-header { background-color: #0079bf; color: white; font-weight: bold; }
        .total-box { font-size: 1.5rem; font-weight: bold; color: #2ecc71; background-color: #e9ecef; }
    </style>
</head>
<body>

<div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-cart-plus"></i> Nova Ordem de Serviço (O.S.)</h2>
        <a href="/" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Voltar ao Kanban</a>
    </div>

    <form action="/salvar_venda" method="POST">
        
        <div class="row">
            <div class="col-md-8">
                
                <div class="card shadow-sm mb-4">
                    <div class="card-header"><i class="bi bi-person-lines-fill"></i> Dados do Cliente</div>
                    <div class="card-body row g-3">
                        <div class="col-md-12">
                            <label class="form-label">Cliente / Empresa *</label>
                            <input type="text" class="form-control" name="cliente_nome" required placeholder="Ex: Gráfica Expressa Ltda">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Nome do Contato</label>
                            <input type="text" class="form-control" name="contato_nome" placeholder="Ex: João Silva">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Telefone / WhatsApp *</label>
                            <input type="text" class="form-control" name="telefone" required placeholder="(79) 99999-9999">
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm mb-4">
                    <div class="card-header"><i class="bi bi-card-text"></i> Detalhes da Produção</div>
                    <div class="card-body row g-3">
                        <div class="col-md-12">
                            <label class="form-label">Descrição do Pedido (Produtos e Serviços) *</label>
                            <textarea class="form-control" name="descricao_pedido" rows="3" required placeholder="Descreva os itens, metragens, acabamentos..."></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Data de Aprovação</label>
                            <input type="date" class="form-control" name="data_aprovacao">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Previsão de Entrega *</label>
                            <input type="date" class="form-control" name="data_entrega" required>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Observações Gerais (Aparece na via do cliente)</label>
                            <textarea class="form-control" name="observacoes" rows="2" placeholder="Ex: Cliente vai retirar no balcão..."></textarea>
                        </div>
                    </div>
                </div>

            </div>

            <div class="col-md-4">
                
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-success"><i class="bi bi-currency-dollar"></i> Fechamento e Valores</div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Valor Produtos (R$)</label>
                            <input type="number" step="0.01" class="form-control calc-valor" id="valor_produtos" name="valor_produtos" value="0.00">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Valor Serviços (R$)</label>
                            <input type="number" step="0.01" class="form-control calc-valor" id="valor_servicos" name="valor_servicos" value="0.00">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Deslocamento/Frete (R$)</label>
                            <input type="number" step="0.01" class="form-control calc-valor" id="valor_frete" name="valor_frete" value="0.00">
                        </div>
                        <div class="mb-3 text-danger">
                            <label class="form-label">Desconto (R$)</label>
                            <input type="number" step="0.01" class="form-control calc-valor" id="valor_desconto" name="valor_desconto" value="0.00">
                        </div>
                        <hr>
                        <div class="mb-3">
                            <label class="form-label fw-bold">TOTAL GERAL (R$)</label>
                            <input type="text" class="form-control total-box text-center" id="valor_total" name="valor_total" value="0.00" readonly>
                        </div>
                        
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg"><i class="bi bi-check-circle"></i> Salvar e Gerar O.S.</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </form>
</div>

<script>
    const inputs = document.querySelectorAll('.calc-valor');
    const totalBox = document.getElementById('valor_total');

    function calcularTotal() {
        let produtos = parseFloat(document.getElementById('valor_produtos').value) || 0;
        let servicos = parseFloat(document.getElementById('valor_servicos').value) || 0;
        let frete = parseFloat(document.getElementById('valor_frete').value) || 0;
        let desconto = parseFloat(document.getElementById('valor_desconto').value) || 0;

        let total = (produtos + servicos + frete) - desconto;
        
        // Formata para 2 casas decimais e atualiza o campo
        totalBox.value = total.toFixed(2);
    }

    // Adiciona o evento de escuta para recalcular toda vez que o vendedor digitar um número
    inputs.forEach(input => {
        input.addEventListener('input', calcularTotal);
    });
</script>

</body>
</html>
